<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glow & Thread — Fashion & Beauty</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#2b2b2b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Georgia, serif; }
  body { background: #faf7f2; color: #2b2b2b; }
  header { background: #2b2b2b; color: #f5e6d3; padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 24px; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 16px; background: #c98f5e; color: white; font-weight: bold; }
  button.ghost { background: transparent; border: 1px solid #f5e6d3; color: #f5e6d3; }
  main { max-width: 1100px; margin: 30px auto; padding: 0 16px; }
  #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .card { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
  .card h3 { margin: 10px 0 4px; }
  .card p { color: #777; font-size: 14px; }
  #cart { background: white; border-radius: 10px; padding: 20px; margin-top: 30px; }
  #cart table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  #cart td, #cart th { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <h1>✨ Glow & Thread</h1>
  <div>
    <span id="userEmail" style="margin-right:12px;"></span>
    <button id="authBtn" onclick="toggleAuth()">Sign in with Google</button>
  </div>
</header>
<main>
  <h2>Shop</h2>
  <div id="products"></div>

  <div id="cart">
    <h2>🛒 Cart</h2>
    <table>
      <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr></thead>
      <tbody id="cartRows"></tbody>
    </table>
    <p><b>Total: ₦<span id="cartTotal">0</span></b></p>
    <button onclick="checkout()">Checkout with Paystack</button>
  </div>
</main>

<script src="/config.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
<script>
const sb = window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);
let cart = [];
let user = null;

async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  user = session?.user || null;
  document.getElementById('userEmail').textContent = user ? user.email : '';
  document.getElementById('authBtn').textContent = user ? 'Sign out' : 'Sign in with Google';
}
async function toggleAuth() {
  if (user) { await sb.auth.signOut(); user = null; }
  else { await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } }); }
  checkAuth();
}

async function loadProducts() {
  const res = await fetch('/api/products');
  const products = await res.json();
  document.getElementById('products').innerHTML = products.map(p => `
    <div class="card">
      <img src="${p.image_url}" alt="${p.name}" />
      <h3>${p.name}</h3>
      <p>${p.description || ''}</p>
      <p><b>₦${p.price.toLocaleString()}</b></p>
      <button onclick='addToCart(${JSON.stringify(p)})'>Add to cart</button>
    </div>`).join('');
}

function addToCart(p) {
  const found = cart.find(i => i.id === p.id);
  if (found) found.qty++; else cart.push({ ...p, qty: 1 });
  renderCart();
}
function removeFromCart(id) { cart = cart.filter(i => i.id !== id); renderCart(); }
function renderCart() {
  document.getElementById('cartRows').innerHTML = cart.map(i => `
    <tr><td>${i.name}</td><td>${i.qty}</td><td>₦${(i.price * i.qty).toLocaleString()}</td>
    <td><button onclick="removeFromCart('${i.id}')">✕</button></td></tr>`).join('');
  document.getElementById('cartTotal').textContent = cart.reduce((s, i) => s + i.price * i.qty, 0).toLocaleString();
}

function checkout() {
  if (!cart.length) return alert('Cart is empty');
  const email = user?.email || prompt('Enter your email for the receipt:');
  if (!email) return;
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const handler = PaystackPop.setup({
    key: APP_CONFIG.PAYSTACK_PUBLIC_KEY,
    email, amount: total * 100, currency: 'NGN',
    callback: function (response) { (async () => {
      const res = await fetch('/api/checkout/verify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference: response.reference, email, items: cart })
      });
      const data = await res.json();
      if (data.success) { alert('Payment successful! Confirmation email sent.'); cart = []; renderCart(); }
      else alert('Error: ' + data.error);
      })(); }
    });
  handler.openIframe();
}

checkAuth();
loadProducts();
</script>
</body>
</html>
